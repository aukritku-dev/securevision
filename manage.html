<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการสินค้า | SecureVision</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { visibility: hidden; margin: 0; font-family: 'Kanit', sans-serif; background: #eef1f7; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 720px; min-height: 100vh; background: #f7f9fc; }
    header { background: #0f2350; color: white; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
    header b { font-size: 20px; display: block; }
    header small { opacity: .75; }
    header a { color: white; text-decoration: none; background: rgba(255,255,255,.15); border-radius: 10px; padding: 8px 12px; }
    main { padding: 16px; }

    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    .toolbar input { flex: 1; padding: 10px 12px; border: 1px solid #dde3ef; border-radius: 10px; font-family: inherit; font-size: 15px; }
    .toolbar button { background: #2563eb; color: white; border: none; border-radius: 10px; padding: 10px 14px; font-family: inherit; font-size: 15px; cursor: pointer; white-space: nowrap; }

    .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; }
    .chip { flex-shrink: 0; background: white; border: 1px solid #dde3ef; border-radius: 999px; padding: 6px 14px; font-family: inherit; font-size: 14px; cursor: pointer; }
    .chip.active { background: #0f2350; color: white; border-color: #0f2350; }

    .item { background: white; border: 1px solid #e5e9f2; border-radius: 14px; padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; }
    .item.off { opacity: .55; }
    .pic { width: 60px; height: 60px; background: #f1f4f9; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; overflow: hidden; }
    .info { flex: 1; min-width: 0; }
    .name { font-size: 15px; }
    .sub { font-size: 13px; color: #64748b; }
    .price { color: #dc2626; font-weight: 600; }
    .old { color: #94a3b8; text-decoration: line-through; font-size: 12px; margin-left: 4px; font-weight: 400; }
    .tag-off { background: #f1f5f9; color: #475569; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-left: 4px; }
    .acts { display: flex; flex-direction: column; gap: 6px; }
    .acts button { background: white; border: 1px solid #dde3ef; border-radius: 8px; padding: 6px 10px; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .acts button.del { border-color: #fecaca; color: #dc2626; }
    .empty { text-align: center; color: #64748b; padding: 30px 0; }

    .modal { position: fixed; inset: 0; background: rgba(15,23,42,.6); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
    .modal.show { display: flex; }
    .sheet { background: white; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px; }
    .sheet label { display: block; font-size: 13px; color: #475569; margin: 10px 0 4px; }
    .sheet input, .sheet select { width: 100%; padding: 10px; border: 1px solid #dde3ef; border-radius: 10px; font-family: inherit; font-size: 15px; background: white; }
    .sheet input:disabled { background: #f1f5f9; color: #64748b; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

    /* รูปสินค้าในฟอร์ม */
    .imgbox { display: flex; gap: 12px; align-items: center; }
    .imgprev { width: 110px; height: 110px; border: 2px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 13px; overflow: hidden; flex-shrink: 0; background: #f8fafc; }
    .imgprev img { width: 100%; height: 100%; object-fit: contain; background: white; }
    .imgbtns { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .upbtn { display: block; text-align: center; background: #eff4ff; color: #2563eb; border: 1px dashed #2563eb; border-radius: 10px; padding: 10px; cursor: pointer; margin: 0 !important; font-size: 14px !important; }
    .imgbtns button { background: white; border: 1px solid #fecaca; color: #dc2626; border-radius: 10px; padding: 8px; font-family: inherit; cursor: pointer; }

    .note { background: #eff4ff; color: #1d4ed8; border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 12px; }
    .row-btn { display: flex; gap: 8px; margin-top: 12px; }
    .row-btn button { flex: 1; background: white; border: 1px solid #dde3ef; border-radius: 10px; padding: 9px; font-family: inherit; cursor: pointer; }
    .save { width: 100%; margin-top: 10px; background: #2563eb; color: white; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-family: inherit; cursor: pointer; }
    .save:disabled { background: #94a3b8; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div><b>🏷️ จัดการสินค้า</b><small>เพิ่ม · แก้ไข · ซ่อน/แสดง · ลบสินค้า</small></div>
      <a href="admin.html">← คำสั่งซื้อ</a>
    </header>

    <main>
      <div class="toolbar">
        <input id="search" placeholder="🔍 ค้นหาชื่อหรือรหัสสินค้า">
        <button id="addBtn">+ เพิ่มสินค้า</button>
      </div>
      <div class="chips" id="chips"></div>
      <div id="list"><p class="empty">กำลังโหลด...</p></div>

    </main>
  </div>

  <!-- ฟอร์มเพิ่ม/แก้ไขสินค้า -->
  <div class="modal" id="formModal">
    <div class="sheet">
      <h3 id="formTitle" style="margin:0">เพิ่มสินค้า</h3>

      <label>📷 รูปสินค้า (ไม่ใส่ก็ได้ จะใช้ไอคอนแทน)</label>
      <div class="imgbox">
        <div class="imgprev" id="imgPrev">ไม่มีรูป</div>
        <div class="imgbtns">
          <label class="upbtn">เลือกรูปจากเครื่อง<input type="file" id="fImg" accept="image/*" hidden></label>
          <button type="button" id="imgClear">ลบรูป</button>
        </div>
      </div>

      <div class="grid2">
        <div><label>รหัสสินค้า *</label><input id="fId" placeholder="เช่น F07"></div>
        <div><label>ไอคอน (อีโมจิ)</label><input id="fIcon" placeholder="🧯" maxlength="8"></div>
      </div>

      <label>ชื่อสินค้า *</label>
      <input id="fName" placeholder="เช่น หัวสปริงเกอร์ 68°C แบบห้อยหัว">

      <label>หมวดหมู่ *</label>
      <select id="fCat"></select>

      <div class="grid2">
        <div><label>ราคาขาย (บาท) *</label><input type="number" id="fPrice" min="0"></div>
        <div><label>ราคาก่อนลด (ถ้ามี)</label><input type="number" id="fOld" min="0"></div>
      </div>

      <div id="newOnly">
        <div class="grid2">
          <div><label>สต็อกเริ่มต้น (ชิ้น)</label><input type="number" id="fStock" min="0" value="0"></div>
          <div><label>ROP (จุดสั่งซื้อ)</label><input type="number" id="fRop" min="0"></div>
        </div>
        <label>EOQ (สั่งครั้งละ)</label>
        <input type="number" id="fEoq" min="0">
      </div>

      <div class="note" id="editNote" style="display:none">📦 ยอดสต็อก, ROP และ EOQ แก้ได้ที่หน้า <b>สต็อก</b> เพื่อให้มีประวัติความเคลื่อนไหวทุกครั้ง</div>

      <div class="row-btn"><button id="formCancel">ยกเลิก</button></div>
      <button class="save" id="formSave">บันทึก</button>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase.js';
    import { requireRole } from './guard.js';
    import { CATEGORIES, esc, productPic, compressImage } from './status.js';
    import { collection, doc, onSnapshot, updateDoc, deleteDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const $ = id => document.getElementById(id);
    const CAT = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

    let products = [];
    let filter = 'all';
    let editing = null;
    let formImage = null;    // รูปในฟอร์ม (data:image/jpeg;base64,... หรือ null)
    let adminEmail = '';

    $('fCat').innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');

    // 1) ตรวจสิทธิ์แอดมิน → ฟังสินค้า
    requireRole('admin', function (user) {
      adminEmail = user.email;
      onSnapshot(collection(db, 'products'), snap => {
        products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        products.sort((a, b) => a.id.localeCompare(b.id));
        render();
      });
      document.body.style.visibility = 'visible';
    });

    // 2) วาดรายการ
    function render() {
      const count = c => products.filter(p => p.cat === c).length;
      $('chips').innerHTML =
        `<button class="chip ${filter === 'all' ? 'active' : ''}" data-f="all">ทั้งหมด (${products.length})</button>` +
        CATEGORIES.map(c => `<button class="chip ${filter === c.id ? 'active' : ''}" data-f="${c.id}">${c.icon} ${c.name} (${count(c.id)})</button>`).join('');

      const q = $('search').value.trim().toLowerCase();
      const list = products.filter(p =>
        (filter === 'all' || p.cat === filter) &&
        (p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q))
      );

      if (list.length === 0) {
        $('list').innerHTML = '<p class="empty">ไม่พบสินค้า</p>';
        return;
      }

      $('list').innerHTML = list.map(p => {
        const off = p.active === false;
        const c = CAT[p.cat];
        return `
          <div class="item ${off ? 'off' : ''}">
            <div class="pic">${productPic(p)}</div>
            <div class="info">
              <div class="name">${esc(p.name)}${off ? '<span class="tag-off">ซ่อนอยู่</span>' : ''}</div>
              <div class="sub">${esc(p.id)} · ${c ? c.icon + ' ' + c.name : 'ไม่มีหมวด'} · คงเหลือ ${Number(p.stock ?? 0)}</div>
              <div class="price">฿${Number(p.price).toLocaleString()}${p.oldPrice ? `<span class="old">฿${Number(p.oldPrice).toLocaleString()}</span>` : ''}</div>
            </div>
            <div class="acts">
              <button data-edit="${esc(p.id)}">✏️ แก้ไข</button>
              <button data-toggle="${esc(p.id)}">${off ? '👁 แสดง' : '🙈 ซ่อน'}</button>
              <button class="del" data-del="${esc(p.id)}">🗑️ ลบ</button>
            </div>
          </div>`;
      }).join('');
    }

    $('chips').addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      filter = btn.dataset.f;
      render();
    });
    $('search').addEventListener('input', render);

    // 3) ปุ่มในรายการ
    $('list').addEventListener('click', async e => {
      const edit = e.target.closest('[data-edit]');
      if (edit) { openForm(edit.dataset.edit); return; }

      // ลบสินค้า: ต้องพิมพ์รหัสสินค้ายืนยันก่อนลบ
      const del = e.target.closest('[data-del]');
      if (del) {
        const p = products.find(x => x.id === del.dataset.del);
        const stock = Number(p.stock ?? 0);
        const warn = stock > 0 ? `\n⚠️ สินค้านี้ยังมีสต็อกเหลือ ${stock} ชิ้น` : '';
        const typed = prompt(`ลบ "${p.name}" ออกจากระบบถาวร?${warn}\nออเดอร์เก่าที่เคยขายสินค้านี้ยังอยู่ แต่จะกู้สินค้าคืนไม่ได้\n\nพิมพ์รหัสสินค้า ${p.id} เพื่อยืนยัน`);
        if (typed === null) return;
        if (typed.trim().toUpperCase() !== p.id) { alert('รหัสไม่ตรง ยกเลิกการลบ'); return; }
        try {
          await deleteDoc(doc(db, 'products', p.id));
        } catch (error) {
          alert('ลบไม่สำเร็จ: ' + error.code);
        }
        return;
      }

      const toggle = e.target.closest('[data-toggle]');
      if (toggle) {
        const p = products.find(x => x.id === toggle.dataset.toggle);
        const hiding = p.active !== false;
        if (hiding && !confirm(`ซ่อน "${p.name}" จากหน้าร้าน?\n(ข้อมูลยังอยู่ กดแสดงกลับได้ภายหลัง)`)) return;
        try {
          await updateDoc(doc(db, 'products', p.id), { active: !hiding, updatedAt: serverTimestamp() });
        } catch (error) {
          alert('อัปเดตไม่สำเร็จ: ' + error.code);
        }
      }
    });

    // 4) รูปสินค้าในฟอร์ม
    function showPreview() {
      $('imgPrev').innerHTML = formImage ? `<img src="${formImage}" alt="ตัวอย่างรูป">` : 'ไม่มีรูป';
    }

    $('fImg').addEventListener('change', async e => {
      const file = e.target.files[0];
      e.target.value = '';                 // ให้เลือกไฟล์เดิมซ้ำได้
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('กรุณาเลือกไฟล์รูปภาพ'); return; }
      try {
        formImage = await compressImage(file, 500, 0.75);   // ย่อด้านยาวสุดเหลือ 500px
        showPreview();
      } catch {
        alert('อ่านไฟล์รูปไม่สำเร็จ ลองรูปอื่น');
      }
    });

    $('imgClear').addEventListener('click', () => {
      formImage = null;
      showPreview();
    });

    // 5) เปิดฟอร์ม
    $('addBtn').addEventListener('click', () => openForm(null));
    $('formCancel').addEventListener('click', () => $('formModal').classList.remove('show'));

    function openForm(id) {
      editing = id;
      const p = id ? products.find(x => x.id === id) : null;

      $('formTitle').textContent = id ? 'แก้ไขสินค้า ' + id : 'เพิ่มสินค้าใหม่';
      $('fId').value = p ? p.id : '';
      $('fId').disabled = !!p;
      $('fName').value = p ? p.name : '';
      $('fCat').value = p ? p.cat : (filter !== 'all' ? filter : CATEGORIES[0].id);
      $('fPrice').value = p ? p.price : '';
      $('fOld').value = p?.oldPrice ?? '';
      $('fIcon').value = p ? (p.icon || '') : '';
      $('fStock').value = 0;
      $('fRop').value = '';
      $('fEoq').value = '';
      formImage = p?.image || null;
      showPreview();
      $('newOnly').style.display = p ? 'none' : 'block';
      $('editNote').style.display = p ? 'block' : 'none';
      $('formModal').classList.add('show');
    }

    // 6) บันทึก
    $('formSave').addEventListener('click', async () => {
      const id = editing || $('fId').value.trim().toUpperCase();
      const name = $('fName').value.trim();
      const cat = $('fCat').value;
      const price = Number($('fPrice').value);
      const oldPrice = $('fOld').value === '' ? null : Number($('fOld').value);
      const icon = $('fIcon').value.trim() || '📦';
      const image = formImage || null;

      if (!/^[A-Z0-9-]{2,20}$/.test(id)) { alert('รหัสสินค้าใช้ได้เฉพาะ A–Z, 0–9 และ - (2–20 ตัว)'); return; }
      if (!editing && products.some(p => p.id === id)) { alert('รหัสสินค้า ' + id + ' มีอยู่แล้ว'); return; }
      if (!name) { alert('กรุณาใส่ชื่อสินค้า'); return; }
      if (!(price > 0)) { alert('กรุณาใส่ราคาขายที่มากกว่า 0'); return; }
      if (oldPrice !== null && !(oldPrice > price)) { alert('ราคาก่อนลดต้องมากกว่าราคาขาย (หรือเว้นว่างไว้)'); return; }

      const btn = $('formSave');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';
      try {
        if (editing) {
          await updateDoc(doc(db, 'products', id), { name, cat, price, oldPrice, icon, image, updatedAt: serverTimestamp() });
        } else {
          const stock = Math.max(0, Math.floor(Number($('fStock').value) || 0));
          const data = { name, cat, price, oldPrice, icon, image, stock, active: true, createdAt: serverTimestamp() };
          if ($('fRop').value !== '') data.rop = Number($('fRop').value);
          if ($('fEoq').value !== '') data.eoq = Number($('fEoq').value);

          const batch = writeBatch(db);
          batch.set(doc(db, 'products', id), data);
          if (stock > 0) {
            batch.set(doc(collection(db, 'stockMoves')), {
              pid: id, name, qty: stock, type: 'adjust',
              ref: 'สต็อกเริ่มต้น (สินค้าใหม่)', by: adminEmail, at: serverTimestamp()
            });
          }
          await batch.commit();
        }
        $('formModal').classList.remove('show');
      } catch (error) {
        console.log(error.code);
        alert('บันทึกไม่สำเร็จ: ' + error.code);
      }
      btn.disabled = false;
      btn.textContent = 'บันทึก';
    });

  </script>
</body>
</html>
