<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | SecureVision</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f3f5fa;
      display: flex;
      justify-content: center;
    }
    .page { width: 100%; max-width: 420px; padding: 24px; }
    .back { color: #667; text-decoration: none; }
    .badge {
      width: 64px; height: 64px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      margin: 24px 0 12px;
    }
    h1 { margin: 0 0 4px; color: #0f2350; }
    p  { margin: 0 0 24px; color: #667; }
    label { display: block; font-weight: bold; margin-bottom: 6px; color: #0f2350; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #dde3ef;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .note { text-align: center; margin-top: 16px; color: #667; font-size: 14px; }
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="role.html">← เปลี่ยนประเภทผู้ใช้</a>

    <div class="badge" id="badge"></div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>

    <form id="loginForm">
      <label>อีเมล</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label>รหัสผ่าน</label>
      <input type="password" id="password" placeholder="••••••••" required>

      <button type="submit" id="btn">เข้าสู่ระบบ</button>
    </form>

    <div class="note" id="note"></div>
  </div>

  <script type="module">
    // 0) ดึง Firebase เข้ามาใช้
    import { auth, db } from './firebase.js';
    import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // 1) ข้อมูลของแต่ละบทบาท
    const roles = {
      customer: {
        icon: '🛒',
        title: 'เข้าสู่ระบบลูกค้า',
        subtitle: 'ซื้อสินค้าและติดตามคำสั่งซื้อของคุณ',
        color: '#1f5eff',
        note: 'ยังไม่มีบัญชี? <a href="#">สมัครสมาชิก</a>'
      },
      tech: {
        icon: '🔧',
        title: 'เข้าสู่ระบบช่างเทคนิค',
        subtitle: 'สำหรับพนักงานช่างของ SecureVision',
        color: '#e08a00',
        note: 'บัญชีช่างสร้างโดยผู้ดูแลระบบเท่านั้น'
      },
      admin: {
        icon: '📊',
        title: 'เข้าสู่ระบบผู้ดูแล',
        subtitle: 'สำหรับผู้ดูแลระบบและผู้บริหาร',
        color: '#0f2350',
        note: 'บัญชีผู้ดูแลสร้างโดยผู้ดูแลระบบเท่านั้น'
      }
    };

    // 2) อ่านค่า ?role= จากที่อยู่เว็บ
    const params = new URLSearchParams(window.location.search);
    const roleKey = params.get('role');
    const role = roles[roleKey];

    // 3) ถ้าไม่มี role หรือพิมพ์ผิด ให้กลับไปหน้าเลือกบทบาท
    if (!role) {
      window.location.href = 'role.html';
    } else {
      // 4) เอาข้อมูลไปใส่ในหน้าเว็บ
      document.getElementById('badge').textContent = role.icon;
      document.getElementById('badge').style.background = role.color + '22';
      document.getElementById('title').textContent = role.title;
      document.getElementById('subtitle').textContent = role.subtitle;
      document.getElementById('btn').style.background = role.color;
      document.getElementById('note').innerHTML = role.note;
    }

    // 5) เมื่อกดปุ่มเข้าสู่ระบบ
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn');

      btn.textContent = 'กำลังเข้าสู่ระบบ...';
      btn.disabled = true;

      try {
        // 5.1 ล็อกอิน
        const result = await signInWithEmailAndPassword(auth, email, password);

        // 5.2 เปิดเอกสาร users/{UID} เพื่อดูบทบาทจริง
        const snap = await getDoc(doc(db, 'users', result.user.uid));
        const realRole = snap.exists() ? snap.data().role : null;

        // 5.3 เทียบกับบทบาทที่เลือกเข้ามา
        if (realRole === roleKey) {
          window.location.href = roleKey === 'customer' ? 'index.html' : roleKey + '.html';
        } else {
          await signOut(auth);
          alert('บัญชีนี้ไม่มีสิทธิ์เข้าใช้งานในส่วนนี้');
        }
      } catch (error) {
        console.log(error.code);
        alert('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
      }

      btn.textContent = 'เข้าสู่ระบบ';
      btn.disabled = false;
    });
  </script>
</body>
</html>
